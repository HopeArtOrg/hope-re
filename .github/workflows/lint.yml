name: lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    environment: Build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PNPM linting
        run: pnpm lint
